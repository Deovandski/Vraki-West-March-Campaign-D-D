name: Website

# Publishes the campaign website (index.html, site/ and the Markdown it reads) to GitHub Pages.
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh the bundled copy of the pages
        run: node site/build-snapshot.js

      - name: Write llms.txt, llms-full.txt and sitemap.xml for AI tools and search engines
        run: node site/build-llms.js

      - name: Stamp the service worker with this commit
        # Each deploy saves a fresh copy of the site on people's devices and drops the old one.
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/" sw.js

      - name: Gather the site
        shell: bash
        run: |
          mkdir _site
          cp -r index.html sw.js .nojekyll site Handouts Maps "World Lore" "D&D Campaign" ./*.md llms.txt llms-full.txt sitemap.xml _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
