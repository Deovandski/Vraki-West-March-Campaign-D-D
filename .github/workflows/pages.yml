name: Website

# Publishes the campaign website (index.html, site/ and the Markdown it reads) to GitHub Pages.
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
# The actions run on Node 24 (checkout v7, setup-node v7, configure-pages v6, upload-pages-artifact v5,
# deploy-pages v5). Pages built by Actions skip Jekyll, so .nojekyll isn't needed (and upload-pages-artifact
# leaves out hidden files).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs, as in GitHub's own Pages workflows: the deploy step looks the upload
  # up by name, and straight after uploading it in the same job it sometimes isn't listed yet ("No artifacts
  # named github-pages were found").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Refresh the bundled copy of the pages
        run: node site/build-snapshot.js

      - name: Write llms.txt, llms-full.txt and sitemap.xml for AI tools and search engines
        run: node site/build-llms.js

      - name: Render the handouts in each language
        # Into Handouts/<lang>/. If this fails the site still deploys, with the English handouts.
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-texgyre fonts-noto-cjk fonts-noto-core > /dev/null
          cd Handouts/source
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium > /dev/null
          node render.js --all

      - name: Write the translations the site loads (site/i18n/)
        run: node tools/i18n.js build

      - name: Report how much is translated
        run: node tools/i18n.js report >> "$GITHUB_STEP_SUMMARY"

      - name: Stamp the service worker with this commit
        # Each deploy saves a fresh copy of the site on people's devices and drops the old one.
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/" sw.js

      - name: Gather the site
        shell: bash
        run: |
          mkdir _site
          # google0c08003a2b869d98.html is the Google Search Console check (#28): never remove it from this list or the repo.
          cp -r index.html sw.js google0c08003a2b869d98.html site Handouts Maps "World Lore" "D&D Campaign" ./*.md llms.txt llms-full.txt sitemap.xml _site/
          # The handout renderer's Playwright install isn't part of the site.
          rm -rf _site/Handouts/source/node_modules _site/Handouts/source/package*.json
          # What gets deployed, biggest first (about 80 MB: the 34 MB print map and the handouts in 7 languages).
          { echo "### Site size: $(du -sh _site | cut -f1)"; echo '```'; du -sh _site/* | sort -rh | head -8; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
